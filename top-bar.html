<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Bandeau score — Live</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --plate:#0c0c0d;
    --plate-2:#1a1a1c;
    --red:#e4032e;         /* rouge AS Monaco — à changer selon l'équipe suivie */
    --paper:#ffffff;
    --ink:#111111;
    --muted:#8d8d8d;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:transparent; font-family:'IBM Plex Mono', monospace; color:var(--ink); }

  #app{ width: 640px; filter: drop-shadow(0 6px 16px rgba(0,0,0,0.28)); }

  .eyebrow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 0 4px 6px;
  }
  .eyebrow-left{
    font-size:11px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase;
    color:#f2f2f2; text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }
  .eyebrow-right{ display:flex; align-items:center; gap:7px; }
  .live-dot{
    width:7px; height:7px; border-radius:50%; background:var(--red);
    animation: dotpulse 1.5s infinite;
  }
  .live-dot.off{ background:var(--muted); animation:none; }
  @keyframes dotpulse{
    0%{ box-shadow:0 0 0 0 rgba(228,3,46,0.55); }
    70%{ box-shadow:0 0 0 7px rgba(228,3,46,0); }
    100%{ box-shadow:0 0 0 0 rgba(228,3,46,0); }
  }
  .eyebrow-status{
    font-size:11px; font-weight:600; letter-spacing:0.8px; text-transform:uppercase;
    color:#f2f2f2; text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }

  .plate-wrap{
    position:relative;
    background: linear-gradient(135deg, var(--plate) 0%, var(--plate-2) 100%);
    overflow:hidden;
  }
  .plate-wrap::before{
    content:""; position:absolute; top:0; left:0; width:0; height:0;
    border-style:solid; border-width: 42px 42px 0 0;
    border-color: var(--red) transparent transparent transparent;
    z-index:1;
  }

  .plate{
    position:relative; z-index:2;
    display:flex; align-items:center; padding: 14px 20px; gap:12px;
  }

  .team{ flex:1; display:flex; align-items:center; gap:10px; min-width:0; }
  .team.away{ flex-direction:row-reverse; text-align:right; }

  .team-crest{ width:28px; height:28px; object-fit:contain; flex-shrink:0; }

  .team-name{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:14px;
    letter-spacing:0.3px; text-transform:uppercase; color:#f7f7f7;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .score-block{ display:flex; align-items:baseline; gap:7px; padding: 0 12px; flex-shrink:0; }
  .score{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:28px; line-height:1;
    color:#ffffff; min-width:26px; text-align:center;
  }
  .score-sep{ color:var(--red); font-size:18px; font-weight:700; }

  .minute-pill{ display:none; justify-content:center; padding: 6px 0 0; }
  .minute-pill.visible{ display:flex; }
  .minute-pill span{
    font-size:10.5px; font-weight:600; letter-spacing:0.5px; color: var(--red);
    background: rgba(228,3,46,0.12); border: 1px solid rgba(228,3,46,0.4); padding: 2px 9px;
  }

  /* ---------- Ticker : une ligne qui tourne toutes les 4s ---------- */
  .ticker{
    background: var(--paper);
    display:flex;
    align-items:center;
    gap:10px;
    padding: 7px 18px;
    font-size:12px;
    min-height:14px;
  }
  .ticker-icon{ width:15px; text-align:center; flex-shrink:0; }
  .ticker-text{
    flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    color:var(--ink);
  }
  .ticker-text b{ font-weight:600; }
  .ticker-text .tag{ color:var(--muted); }
  .ticker-empty{ color:var(--muted); font-size:11.5px; }
</style>
</head>
<body>

<div id="app">
  <div class="eyebrow">
    <div class="eyebrow-left" id="competitionLabel">—</div>
    <div class="eyebrow-right">
      <div class="live-dot off" id="liveDot"></div>
      <div class="eyebrow-status" id="statusLabel">--</div>
    </div>
  </div>

  <div class="plate-wrap">
    <div class="plate">
      <div class="team home">
        <img class="team-crest" id="homeCrest" src="" alt="">
        <div class="team-name" id="homeName">—</div>
      </div>
      <div class="score-block">
        <div class="score" id="homeScore">0</div>
        <div class="score-sep">–</div>
        <div class="score" id="awayScore">0</div>
      </div>
      <div class="team away">
        <img class="team-crest" id="awayCrest" src="" alt="">
        <div class="team-name" id="awayName">—</div>
      </div>
    </div>
    <div class="minute-pill" id="minutePill"><span id="minuteText"></span></div>
  </div>

  <div class="ticker" id="tickerBox">
    <div class="ticker-empty">En attente d'événements…</div>
  </div>
</div>

<script>
/* =====================================================================
   CONFIG — à personnaliser avant de coller l'URL dans OBS
   ===================================================================== */
const CONFIG = {
  API_KEY: "0ff28ece65f54981c6f1967ed9a06cad",     // ta clé depuis dashboard.api-football.com > My Access
  TEAM_ID: 91,                    // 91 = AS Monaco. Change pour suivre une autre équipe.
  POLL_INTERVAL_MS: 90000,        // 90s ≈ 80-90 appels sur un match de 2h
  TICKER_ROTATE_MS: 4500          // vitesse de rotation du ticker (pas d'appel API, juste visuel)
};

const API_BASE = "https://v3.football.api-sports.io";
let currentFixtureId = null;
let tickerEvents = [];
let tickerIndex = 0;

function apiHeaders(){ return { "x-apisports-key": CONFIG.API_KEY }; }

async function apiGet(path){
  const res = await fetch(API_BASE + path, { headers: apiHeaders() });
  if(!res.ok) throw new Error("API error " + res.status);
  const json = await res.json();
  return json.response;
}

function isoDate(d){ return d.toISOString().slice(0,10); }

async function findFixture(){
  const live = await apiGet(`/fixtures?team=${CONFIG.TEAM_ID}&live=all`);
  if(live && live.length > 0) return live[0];

  const today = new Date();
  const from = new Date(today); from.setDate(from.getDate() - 10);
  const to   = new Date(today); to.setDate(to.getDate() + 21);

  const window = await apiGet(
    `/fixtures?team=${CONFIG.TEAM_ID}&from=${isoDate(from)}&to=${isoDate(to)}&timezone=Europe/Paris`
  );
  if(!window || window.length === 0) return null;

  const sorted = [...window].sort((a,b) => new Date(a.fixture.date) - new Date(b.fixture.date));
  const finishedStatuses = new Set(["FT","AET","PEN","PST","CANC","ABD","AWD","WO"]);
  const upcoming = sorted.find(f => !finishedStatuses.has(f.fixture.status.short));
  return upcoming || sorted[sorted.length - 1];
}

const STATUS_MAP = {
  "1H": { label: "1ère MT", live: true },
  "2H": { label: "2ème MT", live: true },
  "HT": { label: "Mi-temps", live: true },
  "ET": { label: "Prolongations", live: true },
  "P":  { label: "Tirs au but", live: true },
  "LIVE": { label: "En direct", live: true },
  "NS": { label: "À venir", live: false },
  "FT": { label: "Terminé", live: false },
  "AET": { label: "Terminé", live: false },
  "PEN": { label: "Terminé", live: false },
  "PST": { label: "Reporté", live: false },
  "CANC": { label: "Annulé", live: false }
};

function renderScoreboard(fixture){
  const { teams, goals, fixture: fx, league } = fixture;

  document.getElementById("homeName").textContent = teams.home.name;
  document.getElementById("awayName").textContent = teams.away.name;
  document.getElementById("homeCrest").src = teams.home.logo || "";
  document.getElementById("awayCrest").src = teams.away.logo || "";
  document.getElementById("homeScore").textContent = goals.home ?? 0;
  document.getElementById("awayScore").textContent = goals.away ?? 0;

  const round = league.round ? league.round.replace(/Regular Season - /i,"J") : "";
  document.getElementById("competitionLabel").textContent =
    [league.name, round].filter(Boolean).join(" · ");

  const st = STATUS_MAP[fx.status.short] || { label: fx.status.short, live: false };
  document.getElementById("statusLabel").textContent = st.label;
  document.getElementById("liveDot").classList.toggle("off", !st.live);

  const pill = document.getElementById("minutePill");
  const minuteText = document.getElementById("minuteText");
  if(st.live && fx.status.elapsed){
    pill.classList.add("visible");
    minuteText.textContent = `${fx.status.elapsed}'`;
  } else {
    pill.classList.remove("visible");
  }
}

function eventIcon(type, detail){
  if(type === "Goal") return "⚽";
  if(type === "Card" && detail === "Yellow Card") return "🟨";
  if(type === "Card" && detail === "Red Card") return "🟥";
  if(type === "subst") return "🔁";
  if(type === "Var") return "📺";
  return "•";
}

function eventToHtml(ev){
  const min = ev.time.elapsed + (ev.time.extra ? "+" + ev.time.extra : "");
  const icon = eventIcon(ev.type, ev.detail);
  let text = "";
  if(ev.type === "Goal"){
    text = `<b>${min}' — ${ev.player.name}</b> <span class="tag">but ${ev.team.name}</span>`;
  } else if(ev.type === "Card"){
    text = `<b>${min}' — ${ev.player.name}</b> <span class="tag">${ev.detail === "Red Card" ? "carton rouge" : "carton jaune"}</span>`;
  } else if(ev.type === "subst"){
    text = `<b>${min}' — ${ev.player.name}</b> <span class="tag">entre pour ${ev.assist?.name || "?"}</span>`;
  } else {
    text = `<b>${min}'</b> <span class="tag">${ev.player?.name || ""} — ${ev.detail || ev.type}</span>`;
  }
  return { icon, text };
}

function updateTickerData(events){
  if(!events || events.length === 0){ tickerEvents = []; return; }
  tickerEvents = [...events].sort((a,b) => (b.time.elapsed - a.time.elapsed)).slice(0, 8);
  if(tickerIndex >= tickerEvents.length) tickerIndex = 0;
}

function renderTickerFrame(){
  const box = document.getElementById("tickerBox");
  if(tickerEvents.length === 0){
    box.innerHTML = `<div class="ticker-empty">En attente d'événements…</div>`;
    return;
  }
  const ev = tickerEvents[tickerIndex % tickerEvents.length];
  const { icon, text } = eventToHtml(ev);
  box.innerHTML = `<div class="ticker-icon">${icon}</div><div class="ticker-text">${text}</div>`;
  tickerIndex++;
}

async function refresh(){
  try{
    const fixture = currentFixtureId
      ? (await apiGet(`/fixtures?id=${currentFixtureId}`))[0]
      : await findFixture();

    if(!fixture) return;

    currentFixtureId = fixture.fixture.id;
    renderScoreboard(fixture);

    // events est inclus directement dans la réponse quand on interroge par id/live
    updateTickerData(fixture.events);
  } catch(err){
    console.error("Overlay error:", err);
  }
}

refresh();
renderTickerFrame();
setInterval(refresh, CONFIG.POLL_INTERVAL_MS);
setInterval(renderTickerFrame, CONFIG.TICKER_ROTATE_MS);
</script>

</body>
</html>
