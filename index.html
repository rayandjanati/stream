<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Overlay Match — Live</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --ink:#111111;
    --paper:#ffffff;
    --line:#111111;
    --red:#c8102e;      /* rouge AS Monaco, réutilisable pour n'importe quelle équipe */
    --muted:#6b6b6b;
    --live:#c8102e;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    background:transparent;
    font-family:'IBM Plex Mono', monospace;
    color:var(--ink);
  }

  #app{
    width: 640px;
    padding: 0;
  }

  /* ---------- Bandeau score ---------- */
  .scoreboard{
    background: var(--paper);
    border: 2px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 14px 20px;
  }

  .team{
    display:flex;
    align-items:center;
    gap:10px;
    flex:1;
    min-width:0;
  }
  .team.away{ flex-direction:row-reverse; text-align:right; }

  .team-crest{
    width:28px; height:28px;
    object-fit:contain;
    flex-shrink:0;
  }

  .team-name{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:16px;
    letter-spacing:0.2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .score-block{
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 18px;
    flex-shrink:0;
  }

  .score{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:30px;
    line-height:1;
    letter-spacing:1px;
  }

  .dash{ color:var(--muted); font-size:22px; }

  .status-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    min-width:58px;
  }

  .status-badge{
    font-size:11px;
    font-weight:600;
    letter-spacing:0.5px;
    text-transform:uppercase;
    padding:2px 7px;
    border:1px solid var(--line);
  }
  .status-badge.live{
    background:var(--live);
    color:#fff;
    border-color:var(--live);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:0.55; }
  }

  .minute{
    font-size:11px;
    color:var(--muted);
    margin-top:2px;
  }

  /* ---------- Fil d'événements ---------- */
  .events{
    border: 2px solid var(--line);
    border-top: none;
    background: var(--paper);
    max-height: 132px;
    overflow:hidden;
  }

  .event-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 20px;
    font-size:12px;
    border-top: 1px solid #e5e5e5;
  }
  .event-row:first-child{ border-top:none; }

  .event-min{
    font-weight:600;
    color:var(--red);
    width:32px;
    flex-shrink:0;
  }

  .event-icon{
    width:14px;
    text-align:center;
    flex-shrink:0;
  }

  .event-text{
    flex:1;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .event-text b{ font-weight:600; }

  /* ---------- Compositions ---------- */
  .lineups{
    display:none;
    border: 2px solid var(--line);
    border-top:none;
    background: var(--paper);
    padding: 14px 20px 16px;
  }
  .lineups.visible{ display:block; }

  .lineups-grid{
    display:flex;
    gap:24px;
  }
  .lineup-col{ flex:1; min-width:0; }

  .lineup-head{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.6px;
    margin-bottom:6px;
    padding-bottom:4px;
    border-bottom:2px solid var(--line);
  }

  .lineup-formation{
    font-size:10px;
    color:var(--muted);
    font-weight:400;
    text-transform:none;
    letter-spacing:0;
  }

  .player-row{
    display:flex;
    align-items:baseline;
    gap:8px;
    font-size:11.5px;
    padding:2.5px 0;
  }
  .player-num{
    color:var(--red);
    font-weight:600;
    width:18px;
    flex-shrink:0;
    text-align:right;
  }
  .player-name{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* ---------- Footer discret ---------- */
  .foot{
    text-align:right;
    font-size:9px;
    color:var(--muted);
    padding:4px 6px 0 0;
    letter-spacing:0.3px;
  }

  .hidden{ display:none !important; }
</style>
</head>
<body>

<div id="app">
  <div class="scoreboard">
    <div class="team home">
      <img class="team-crest" id="homeCrest" src="" alt="">
      <div class="team-name" id="homeName">—</div>
    </div>

    <div class="score-block">
      <div class="score" id="homeScore">0</div>
      <div class="dash">–</div>
      <div class="score" id="awayScore">0</div>
    </div>

    <div class="status-col">
      <div class="status-badge" id="statusBadge">--</div>
      <div class="minute" id="minute"></div>
    </div>

    <div class="score-block" style="padding-left:0;"></div>

    <div class="team away">
      <img class="team-crest" id="awayCrest" src="" alt="">
      <div class="team-name" id="awayName">—</div>
    </div>
  </div>

  <div class="events" id="eventsBox"></div>

  <div class="lineups" id="lineupsBox">
    <div class="lineups-grid">
      <div class="lineup-col">
        <div class="lineup-head" id="homeLineupHead">DOMICILE <span class="lineup-formation" id="homeFormation"></span></div>
        <div id="homeLineup"></div>
      </div>
      <div class="lineup-col">
        <div class="lineup-head" id="awayLineupHead">EXTÉRIEUR <span class="lineup-formation" id="awayFormation"></span></div>
        <div id="awayLineup"></div>
      </div>
    </div>
  </div>

  <div class="foot">api-football</div>
</div>

<script>
/* =====================================================================
   CONFIG — à personnaliser avant de coller l'URL dans OBS
   ===================================================================== */
const CONFIG = {
  API_KEY: "0ff28ece65f54981c6f1967ed9a06cad",           // ta clé depuis dashboard.api-football.com > My Access
  TEAM_ID: 91,                          // 91 = AS Monaco. Change pour suivre une autre équipe.
  POLL_INTERVAL_MS: 60000,              // 60s = 2 appels/min max (score+events+lineups) → large marge sous 100/jour
  SHOW_LINEUPS_BEFORE_KICKOFF_MIN: 90,  // affiche les compos dès qu'elles sont publiées (~1h avant)
  MAX_EVENTS_SHOWN: 6
};

const API_BASE = "https://v3.football.api-sports.io";
let currentFixtureId = null;
let lastEventIds = new Set();
let lineupsFetched = false;

function apiHeaders(){
  return { "x-apisports-key": CONFIG.API_KEY };
}

async function apiGet(path){
  const res = await fetch(API_BASE + path, { headers: apiHeaders() });
  if(!res.ok) throw new Error("API error " + res.status);
  const json = await res.json();
  return json.response;
}

/* Trouve le match en cours ou le prochain match de l'équipe suivie.
   Note: les paramètres "next" et "last" seuls sont bloqués sur le plan Free
   ("Free plans do not have access..."). On passe donc par une recherche
   sur une plage de dates, méthode toujours autorisée sur le plan gratuit. */
function isoDate(d){
  return d.toISOString().slice(0,10); // YYYY-MM-DD
}

async function findFixture(){
  // 1. Cherche un match live pour cette équipe
  const live = await apiGet(`/fixtures?team=${CONFIG.TEAM_ID}&live=all`);
  if(live && live.length > 0) return live[0];

  // 2. Sinon regarde les fixtures sur une fenêtre de dates (J-10 à J+21)
  //    pour couvrir aussi bien un match récent qu'un match à venir.
  const today = new Date();
  const from = new Date(today); from.setDate(from.getDate() - 10);
  const to   = new Date(today); to.setDate(to.getDate() + 21);

  const window = await apiGet(
    `/fixtures?team=${CONFIG.TEAM_ID}&from=${isoDate(from)}&to=${isoDate(to)}&timezone=Europe/Paris`
  );

  if(!window || window.length === 0) return null;

  // Trie par date et priorise : le premier match pas encore terminé,
  // sinon le plus récent match déjà joué.
  const sorted = [...window].sort((a,b) =>
    new Date(a.fixture.date) - new Date(b.fixture.date)
  );

  const finishedStatuses = new Set(["FT","AET","PEN","PST","CANC","ABD","AWD","WO"]);
  const upcoming = sorted.find(f => !finishedStatuses.has(f.fixture.status.short));
  if(upcoming) return upcoming;

  // Tout est déjà joué dans la fenêtre : renvoie le plus récent
  return sorted[sorted.length - 1];
}

const STATUS_MAP = {
  "1H": { label: "1MT", live: true },
  "2H": { label: "2MT", live: true },
  "HT": { label: "MT",  live: true },
  "ET": { label: "PROL", live: true },
  "P":  { label: "TAB", live: true },
  "LIVE": { label: "LIVE", live: true },
  "NS": { label: "À VENIR", live: false },
  "FT": { label: "TERMINÉ", live: false },
  "AET": { label: "TERMINÉ", live: false },
  "PEN": { label: "TERMINÉ", live: false },
  "PST": { label: "REPORTÉ", live: false },
  "CANC": { label: "ANNULÉ", live: false }
};

function renderScoreboard(fixture){
  const { teams, goals, fixture: fx } = fixture;

  document.getElementById("homeName").textContent = teams.home.name;
  document.getElementById("awayName").textContent = teams.away.name;
  document.getElementById("homeCrest").src = teams.home.logo || "";
  document.getElementById("awayCrest").src = teams.away.logo || "";

  document.getElementById("homeScore").textContent = goals.home ?? 0;
  document.getElementById("awayScore").textContent = goals.away ?? 0;

  const st = STATUS_MAP[fx.status.short] || { label: fx.status.short, live: false };
  const badge = document.getElementById("statusBadge");
  badge.textContent = st.label;
  badge.classList.toggle("live", st.live);

  const minuteEl = document.getElementById("minute");
  minuteEl.textContent = st.live && fx.status.elapsed ? `${fx.status.elapsed}'` : "";
}

function eventIcon(type, detail){
  if(type === "Goal") return "⚽";
  if(type === "Card" && detail === "Yellow Card") return "🟨";
  if(type === "Card" && detail === "Red Card") return "🟥";
  if(type === "subst") return "🔁";
  return "•";
}

function renderEvents(events){
  const box = document.getElementById("eventsBox");
  if(!events || events.length === 0){
    box.innerHTML = "";
    return;
  }

  const sorted = [...events].sort((a,b) => (b.time.elapsed - a.time.elapsed));
  const shown = sorted.slice(0, CONFIG.MAX_EVENTS_SHOWN);

  box.innerHTML = shown.map(ev => {
    const min = ev.time.elapsed + (ev.time.extra ? "+" + ev.time.extra : "");
    const icon = eventIcon(ev.type, ev.detail);
    let text = "";
    if(ev.type === "Goal"){
      text = `<b>${ev.player.name}</b> — But ${ev.team.name}`;
    } else if(ev.type === "Card"){
      text = `<b>${ev.player.name}</b> — ${ev.detail === "Red Card" ? "Carton rouge" : "Carton jaune"}`;
    } else if(ev.type === "subst"){
      text = `<b>${ev.assist?.name || "?"}</b> ↔ ${ev.player.name}`;
    } else {
      text = `${ev.player?.name || ""} — ${ev.detail || ev.type}`;
    }
    return `
      <div class="event-row">
        <div class="event-min">${min}'</div>
        <div class="event-icon">${icon}</div>
        <div class="event-text">${text}</div>
      </div>`;
  }).join("");
}

function renderLineups(lineups){
  const box = document.getElementById("lineupsBox");
  if(!lineups || lineups.length < 2){
    box.classList.remove("visible");
    return;
  }
  box.classList.add("visible");

  const [home, away] = lineups;

  document.getElementById("homeFormation").textContent = home.formation ? `(${home.formation})` : "";
  document.getElementById("awayFormation").textContent = away.formation ? `(${away.formation})` : "";

  const renderCol = (team) => {
    const starters = team.startXI || [];
    return starters.map(p => `
      <div class="player-row">
        <div class="player-num">${p.player.number ?? ""}</div>
        <div class="player-name">${p.player.name}</div>
      </div>`).join("");
  };

  document.getElementById("homeLineup").innerHTML = renderCol(home);
  document.getElementById("awayLineup").innerHTML = renderCol(away);
}

async function refresh(){
  try{
    const fixture = currentFixtureId
      ? (await apiGet(`/fixtures?id=${currentFixtureId}`))[0]
      : await findFixture();

    if(!fixture){
      return;
    }

    const fixtureChanged = currentFixtureId !== fixture.fixture.id;
    currentFixtureId = fixture.fixture.id;
    renderScoreboard(fixture);
    renderEvents(fixture.events);

    // Compos : récupérées une seule fois (elles ne changent pas en cours de match),
    // ou re-tentées si elles n'ont pas encore été publiées côté API.
    if(fixtureChanged || !lineupsFetched){
      const lineups = await apiGet(`/fixtures/lineups?fixture=${currentFixtureId}`);
      renderLineups(lineups);
      if(lineups && lineups.length >= 2) lineupsFetched = true;
    }

  } catch(err){
    console.error("Overlay error:", err);
  }
}

refresh();
setInterval(refresh, CONFIG.POLL_INTERVAL_MS);
</script>

</body>
</html>
