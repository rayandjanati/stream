<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Compo — Domicile</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --red:#e4032e;      /* rouge AS Monaco — à changer selon l'équipe suivie */
    --paper:#ffffff;
    --ink:#111111;
    --muted:#8d8d8d;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:transparent; font-family:'IBM Plex Mono', monospace; color:var(--ink); }

  #panel{
    width: 210px;
    background: var(--paper);
    padding: 16px 16px 18px;
    filter: drop-shadow(0 6px 16px rgba(0,0,0,0.22));
  }

  .head-row{
    display:flex; align-items:center; gap:8px;
    padding-bottom:8px; margin-bottom:10px;
    border-bottom: 2px solid var(--red);
  }
  .crest{ width:22px; height:22px; object-fit:contain; flex-shrink:0; }
  .team-name{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:12.5px;
    text-transform:uppercase; letter-spacing:0.4px; line-height:1.15;
  }
  .formation{ font-size:10px; color:var(--muted); margin-top:1px; }

  .player-row{ display:flex; align-items:center; gap:9px; padding:4px 0; font-size:12px; }
  .player-num{
    color:#fff; background:var(--red); font-weight:600; font-size:10px;
    width:18px; height:18px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .player-name{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .placeholder{
    font-size:11px; color:var(--muted); padding: 6px 0 2px; line-height:1.5;
  }
</style>
</head>
<body>

<div id="panel">
  <div class="head-row">
    <img class="crest" id="crest" src="" alt="">
    <div>
      <div class="team-name" id="teamName">DOMICILE</div>
      <div class="formation" id="formation"></div>
    </div>
  </div>
  <div id="playersBox">
    <div class="placeholder">Composition à venir…</div>
  </div>
</div>

<script>
/* =====================================================================
   CONFIG — même clé/équipe que les autres panneaux
   ===================================================================== */
const CONFIG = {
  API_KEY: "0ff28ece65f54981c6f1967ed9a06cad",
  TEAM_ID: 91,                     // 91 = AS Monaco — sert juste à retrouver le bon match
  SIDE: "home",                    // ce panneau affiche toujours l'équipe à DOMICILE
  RETRY_INTERVAL_MS: 300000        // 5 min : les compos ne changent pas, inutile d'interroger souvent
};

const API_BASE = "https://v3.football.api-sports.io";
let currentFixtureId = null;
let lineupFound = false;

function apiHeaders(){ return { "x-apisports-key": CONFIG.API_KEY }; }

async function apiGet(path){
  const res = await fetch(API_BASE + path, { headers: apiHeaders() });
  if(!res.ok) throw new Error("API error " + res.status);
  const json = await res.json();
  return json.response;
}

function isoDate(d){ return d.toISOString().slice(0,10); }

async function findFixture(){
  const live = await apiGet(`/fixtures?team=${CONFIG.TEAM_ID}&live=all`);
  if(live && live.length > 0) return live[0];

  const today = new Date();
  const from = new Date(today); from.setDate(from.getDate() - 10);
  const to   = new Date(today); to.setDate(to.getDate() + 21);

  const window = await apiGet(
    `/fixtures?team=${CONFIG.TEAM_ID}&from=${isoDate(from)}&to=${isoDate(to)}&timezone=Europe/Paris`
  );
  if(!window || window.length === 0) return null;

  const sorted = [...window].sort((a,b) => new Date(a.fixture.date) - new Date(b.fixture.date));
  const finishedStatuses = new Set(["FT","AET","PEN","PST","CANC","ABD","AWD","WO"]);
  const upcoming = sorted.find(f => !finishedStatuses.has(f.fixture.status.short));
  return upcoming || sorted[sorted.length - 1];
}

function renderLineup(fixture, lineups){
  // Affiche toujours l'équipe du côté configuré (domicile ou extérieur),
  // peu importe si c'est l'équipe suivie ou son adversaire.
  const teamInfo = CONFIG.SIDE === "home" ? fixture.teams.home : fixture.teams.away;

  document.getElementById("crest").src = teamInfo.logo || "";
  document.getElementById("teamName").textContent = teamInfo.name;

  if(!lineups || lineups.length < 2){ return; }

  const teamLineup = lineups.find(l => l.team.id === teamInfo.id);
  if(!teamLineup || !teamLineup.startXI || teamLineup.startXI.length === 0) return;

  document.getElementById("formation").textContent = teamLineup.formation ? `(${teamLineup.formation})` : "";

  document.getElementById("playersBox").innerHTML = teamLineup.startXI.map(p => `
    <div class="player-row">
      <div class="player-num">${p.player.number ?? ""}</div>
      <div class="player-name">${p.player.name}</div>
    </div>`).join("");

  lineupFound = true;
}

async function refresh(){
  try{
    const fixture = currentFixtureId
      ? (await apiGet(`/fixtures?id=${currentFixtureId}`))[0]
      : await findFixture();

    if(!fixture) return;
    currentFixtureId = fixture.fixture.id;

    // lineups déjà inclus dans la réponse quand on interroge par id
    renderLineup(fixture, fixture.lineups);

  } catch(err){
    console.error("Panel error:", err);
  }
}

function loop(){
  refresh().finally(() => {
    if(!lineupFound){
      setTimeout(loop, CONFIG.RETRY_INTERVAL_MS);
    }
    // une fois trouvée, on arrête de solliciter l'API pour ce match
  });
}

loop();
</script>

</body>
</html>
