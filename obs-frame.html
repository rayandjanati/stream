<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Overlay match — AS Monaco</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap');

  :root{
    --bg:#12151c;
    --panel:#1a1f2a;
    --panel-border: rgba(255,255,255,0.07);
    --accent:#c8102e;        /* rouge AS Monaco — seule touche de couleur */
    --pitch:#16332a;
    --pitch-line: rgba(255,255,255,0.28);
    --text:#f2f2f0;
    --muted:#7d8290;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:1920px; height:1080px; overflow:hidden; font-family:'Inter', sans-serif; background:transparent; color:var(--text); }

  #frame{ position:relative; width:1920px; height:1080px; }

  /* ============ BANDEAU SCORE — grille symétrique pour un vrai centrage ============ */
  .top-bar{
    position:absolute; top:0; left:0; width:100%; height:150px;
    background: var(--bg);
    border-bottom: 1px solid var(--panel-border);
    box-shadow: 0 8px 20px rgba(0,0,0,0.35);
    display:grid;
    grid-template-columns: 1fr auto auto auto auto auto 1fr;
    align-items:center;
    column-gap:26px;
    padding: 0 40px;
  }
  .tb-crest{
    width:60px; height:60px; border-radius:50%; background:var(--panel);
    border: 1px solid var(--panel-border);
    background-size:64%; background-position:center; background-repeat:no-repeat;
    flex-shrink:0;
  }
  .tb-crest.home{ justify-self:end; }
  .tb-crest.away{ justify-self:start; }

  .tb-divider{ width:1px; height:64px; background: var(--panel-border); }

  .tb-name{
    font-family:'Oswald', sans-serif; font-weight:700; font-size:30px; letter-spacing:0.03em;
    text-transform:uppercase; color:var(--text); white-space:nowrap;
  }
  .tb-name.home{ text-align:right; justify-self:end; }
  .tb-name.away{ text-align:left; justify-self:start; }

  .tb-score-col{ display:flex; flex-direction:column; align-items:center; gap:7px; min-width:210px; }
  .tb-competition{ display:flex; align-items:center; gap:6px; }
  .tb-competition-badge{ width:14px; height:14px; border-radius:3px; background: var(--accent); flex-shrink:0; }
  .tb-competition-label{ font-size:12px; color: var(--muted); letter-spacing:0.08em; text-transform:uppercase; }

  .tb-score{
    font-family:'Inter', sans-serif; font-weight:900; font-size:42px;
    font-variant-numeric: tabular-nums; color:#fff; display:flex; align-items:center; gap:12px;
  }
  .tb-score .sep{ color:var(--accent); font-size:24px; }

  .tb-status-row{ display:flex; align-items:center; gap:9px; }
  .tb-live{
    display:flex; align-items:center; gap:6px;
    background: var(--accent); color:#fff; font-family:'Oswald', sans-serif; font-weight:600;
    font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase;
    padding: 3px 9px; border-radius:3px;
  }
  .tb-live-dot{ width:5px; height:5px; border-radius:50%; background:#fff; animation: pulse 1.4s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.4;} }
  .tb-status{ font-size:12px; color: var(--muted); letter-spacing:0.03em; }

  .tb-progress-track{ width:180px; height:3px; background: var(--panel-border); border-radius:2px; overflow:hidden; margin-top:2px; }
  .tb-progress-fill{ height:100%; background: var(--accent); width:0%; transition: width 0.6s ease; }

  /* ============ PANNEAUX COMPOS — cartes arrondies flottantes ============ */
  .xi-card{
    position:absolute; top:190px; width:320px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    box-shadow: 0 10px 26px rgba(0,0,0,0.32);
    padding: 18px 18px 20px;
  }
  .xi-card.left{ left:26px; }
  .xi-card.right{ right:26px; }

  .xi-header{ display:flex; align-items:center; gap:9px; margin-bottom:14px; }
  .xi-icon{
    width:20px; height:20px; border-radius:5px; background: var(--accent);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .xi-icon svg{ width:12px; height:12px; }
  .xi-header-label{
    font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color: var(--muted);
  }

  .xi-team-row{ display:flex; align-items:center; gap:10px; margin-bottom:14px; padding-bottom:14px; border-bottom: 1px solid var(--panel-border); }
  .xi-crest{
    width:32px; height:32px; border-radius:50%; background:#20242f;
    border: 1px solid var(--panel-border);
    background-size:68%; background-position:center; background-repeat:no-repeat; flex-shrink:0;
  }
  .xi-team-name{ font-family:'Oswald', sans-serif; font-weight:600; font-size:15px; text-transform:uppercase; letter-spacing:0.03em; color:var(--text); }
  .xi-formation{ font-size:11px; color: var(--muted); margin-top:1px; }

  .pitch-wrap{ width:100%; aspect-ratio: 280 / 420; border-radius:8px; overflow:hidden; }

  /* ============ CADRE DÉCORATIF WEBCAM ============ */
  .webcam-frame{
    position:absolute; top:190px; left:366px; width:1188px; height:850px;
    border-radius:14px;
    border: 1px solid var(--panel-border);
    pointer-events:none;
  }
</style>
</head>
<body>

<div id="frame">

  <div class="top-bar">
    <div class="tb-crest home" id="homeCrest"></div>
    <div class="tb-name home" id="homeName">DOMICILE</div>
    <div class="tb-divider"></div>
    <div class="tb-score-col">
      <div class="tb-competition">
        <div class="tb-competition-badge"></div>
        <div class="tb-competition-label" id="competitionLabel">—</div>
      </div>
      <div class="tb-score">
        <span id="homeScore">0</span><span class="sep">–</span><span id="awayScore">0</span>
      </div>
      <div class="tb-status-row">
        <div class="tb-live" id="tbLive" style="display:none;"><div class="tb-live-dot"></div>LIVE</div>
        <div class="tb-status" id="statusLabel">À venir</div>
      </div>
      <div class="tb-progress-track"><div class="tb-progress-fill" id="progressFill"></div></div>
    </div>
    <div class="tb-divider"></div>
    <div class="tb-name away" id="awayName">EXTÉRIEUR</div>
    <div class="tb-crest away" id="awayCrest"></div>
  </div>

  <div class="xi-card left">
    <div class="xi-header">
      <div class="xi-header-label">Composition</div>
    </div>
    <div class="xi-team-row">
      <div class="xi-crest" id="xiHomeCrest"></div>
      <div>
        <div class="xi-team-name" id="xiHomeName">Domicile</div>
        <div class="xi-formation" id="homeFormation"></div>
      </div>
    </div>
    <div class="pitch-wrap" id="homePitch"></div>
  </div>

  <div class="webcam-frame"></div>

  <div class="xi-card right">
    <div class="xi-header">
      <div class="xi-header-label">Composition</div>
    </div>
    <div class="xi-team-row">
      <div class="xi-crest" id="xiAwayCrest"></div>
      <div>
        <div class="xi-team-name" id="xiAwayName">Extérieur</div>
        <div class="xi-formation" id="awayFormation"></div>
      </div>
    </div>
    <div class="pitch-wrap" id="awayPitch"></div>
  </div>

</div>

<script>
/* =====================================================================
   CONFIG
   ===================================================================== */
const CONFIG = {
  API_KEY: "TA_CLE_API_ICI",
  TEAM_ID: 91,                 // 91 = AS Monaco
  POLL_INTERVAL_MS: 120000
};

const API_BASE = "https://v3.football.api-sports.io";
let currentFixtureId = null;

function apiHeaders(){ return { "x-apisports-key": CONFIG.API_KEY }; }
async function apiGet(path){
  const res = await fetch(API_BASE + path, { headers: apiHeaders() });
  if(!res.ok) throw new Error("API error " + res.status);
  return (await res.json()).response;
}
function isoDate(d){ return d.toISOString().slice(0,10); }

async function findFixture(){
  const live = await apiGet(`/fixtures?team=${CONFIG.TEAM_ID}&live=all`);
  if(live && live.length > 0) return live[0];

  const today = new Date();
  const from = new Date(today); from.setDate(from.getDate() - 10);
  const to   = new Date(today); to.setDate(to.getDate() + 21);
  const window = await apiGet(`/fixtures?team=${CONFIG.TEAM_ID}&from=${isoDate(from)}&to=${isoDate(to)}&timezone=Europe/Paris`);
  if(!window || window.length === 0) return null;

  const sorted = [...window].sort((a,b) => new Date(a.fixture.date) - new Date(b.fixture.date));
  const finishedStatuses = new Set(["FT","AET","PEN","PST","CANC","ABD","AWD","WO"]);
  const upcoming = sorted.find(f => !finishedStatuses.has(f.fixture.status.short));
  return upcoming || sorted[sorted.length - 1];
}

const STATUS_MAP = {
  "1H": { label: "1ère mi-temps", live: true }, "2H": { label: "2ème mi-temps", live: true },
  "HT": { label: "Mi-temps", live: true }, "ET": { label: "Prolongations", live: true },
  "P":  { label: "Tirs au but", live: true }, "LIVE": { label: "En direct", live: true },
  "NS": { label: "À venir", live: false }, "FT": { label: "Terminé", live: false },
  "AET": { label: "Terminé", live: false }, "PEN": { label: "Terminé", live: false },
  "PST": { label: "Reporté", live: false }, "CANC": { label: "Annulé", live: false }
};

/* ---------- Positionnement tactique (terrain) ---------- */
function buildPositions(formation, startXI){
  const hasGrid = startXI.every(p => p.player.grid);
  if(hasGrid){
    const rows = {};
    startXI.forEach(p => {
      const [r,c] = p.player.grid.split(":").map(Number);
      if(!rows[r]) rows[r] = [];
      rows[r].push({ player: p.player, col: c });
    });
    const rowNums = Object.keys(rows).map(Number).sort((a,b)=>a-b);
    const maxRow = Math.max(...rowNums);
    const positions = [];
    rowNums.forEach(r => {
      const arr = rows[r].sort((a,b)=>a.col-b.col);
      const n = arr.length;
      arr.forEach((p,i) => positions.push({ player: p.player, x:(i+1)/(n+1), y: 1-(r-1)/((maxRow-1)||1) }));
    });
    return positions;
  }
  const lines = (formation || "").split("-").map(n => parseInt(n,10)).filter(n => !isNaN(n));
  const groups = [1, ...lines];
  const positions = [];
  let idx = 0;
  groups.forEach((count, li) => {
    const rowPlayers = startXI.slice(idx, idx+count);
    idx += count;
    rowPlayers.forEach((p,ci) => positions.push({ player: p.player, x:(ci+1)/(count+1), y: 1-li/((groups.length-1)||1) }));
  });
  return positions;
}

function renderPitch(formation, startXI){
  const positions = buildPositions(formation, startXI);
  const W = 280, H = 420;
  const boundary = { x:4, y:4, w:272, h:412 };
  const marginX = 22, marginTop = 20, marginBottom = 36;
  const usableW = W - marginX*2, usableH = H - marginTop - marginBottom;
  const halfwayY = boundary.y + boundary.h/2;

  const markers = positions.map((p, idx) => {
    const cx = marginX + p.x * usableW, cy = marginTop + p.y * usableH;
    const rowSize = positions.filter(q => Math.abs(q.y - p.y) < 0.001).length;
    const fontSize = rowSize >= 5 ? 10 : 11;
    const isGK = idx === 0;
    const dotColor = isGK ? "#1fae5a" : "var(--accent)";
    const surname = (p.player.name || "").split(" ").slice(-1)[0];
    return `
      <g>
        <circle cx="${cx}" cy="${cy}" r="12" fill="${dotColor}" stroke="#ffffff" stroke-width="1.8"/>
        <text x="${cx}" y="${cy+3.5}" text-anchor="middle" font-family="Inter" font-weight="700" font-size="10" fill="#ffffff">${p.player.number ?? ""}</text>
        <text x="${cx}" y="${cy+21}" text-anchor="middle" font-family="Inter" font-weight="600" font-size="${fontSize}" fill="#ffffff" stroke="rgba(0,0,0,0.4)" stroke-width="3" paint-order="stroke">${surname}</text>
      </g>`;
  }).join("");

  return `
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" style="display:block;">
      <rect x="0" y="0" width="${W}" height="${H}" fill="var(--pitch)"/>
      <rect x="${boundary.x}" y="${boundary.y}" width="${boundary.w}" height="${boundary.h}" fill="none" stroke="var(--pitch-line)" stroke-width="1.6"/>
      <line x1="${boundary.x}" y1="${halfwayY}" x2="${boundary.x+boundary.w}" y2="${halfwayY}" stroke="var(--pitch-line)" stroke-width="1.4"/>
      <circle cx="${W/2}" cy="${halfwayY}" r="34" fill="none" stroke="var(--pitch-line)" stroke-width="1.4"/>
      <circle cx="${W/2}" cy="${halfwayY}" r="2.2" fill="var(--pitch-line)"/>
      <rect x="${W/2-58}" y="${boundary.y+boundary.h-42}" width="116" height="42" fill="none" stroke="var(--pitch-line)" stroke-width="1.2" opacity="0.85"/>
      <rect x="${W/2-28}" y="${boundary.y+boundary.h-16}" width="56" height="16" fill="none" stroke="var(--pitch-line)" stroke-width="1.2" opacity="0.85"/>
      <rect x="${W/2-58}" y="${boundary.y}" width="116" height="42" fill="none" stroke="var(--pitch-line)" stroke-width="1.2" opacity="0.85"/>
      <rect x="${W/2-28}" y="${boundary.y+16}" width="56" height="16" fill="none" stroke="var(--pitch-line)" stroke-width="1.2" opacity="0.85"/>
      ${markers}
    </svg>`;
}

function setCrest(el, logo){ el.style.backgroundImage = logo ? `url(${logo})` : ""; }

function render(fixture){
  const { teams, goals, fixture: fx, league, lineups } = fixture;

  setCrest(document.getElementById("homeCrest"), teams.home.logo);
  setCrest(document.getElementById("awayCrest"), teams.away.logo);
  setCrest(document.getElementById("xiHomeCrest"), teams.home.logo);
  setCrest(document.getElementById("xiAwayCrest"), teams.away.logo);

  document.getElementById("homeName").textContent = teams.home.name;
  document.getElementById("awayName").textContent = teams.away.name;
  document.getElementById("xiHomeName").textContent = teams.home.name;
  document.getElementById("xiAwayName").textContent = teams.away.name;
  document.getElementById("homeScore").textContent = goals.home ?? 0;
  document.getElementById("awayScore").textContent = goals.away ?? 0;

  const round = league.round ? league.round.replace(/Regular Season - /i,"J") : "";
  document.getElementById("competitionLabel").textContent = [league.name, round].filter(Boolean).join(" · ");

  const st = STATUS_MAP[fx.status.short] || { label: fx.status.short, live: false };
  document.getElementById("tbLive").style.display = st.live ? "flex" : "none";
  document.getElementById("statusLabel").textContent = st.live && fx.status.elapsed ? `${st.label} · ${fx.status.elapsed}'` : st.label;
  const progressPct = st.live && fx.status.elapsed ? Math.min(100, (fx.status.elapsed/90)*100) : (fx.status.short === "FT" ? 100 : 0);
  document.getElementById("progressFill").style.width = progressPct + "%";

  if(lineups && lineups.length >= 2){
    const home = lineups.find(l => l.team.id === teams.home.id);
    const away = lineups.find(l => l.team.id === teams.away.id);
    if(home?.startXI?.length){
      document.getElementById("homeFormation").textContent = home.formation || "";
      document.getElementById("homePitch").innerHTML = renderPitch(home.formation, home.startXI);
    }
    if(away?.startXI?.length){
      document.getElementById("awayFormation").textContent = away.formation || "";
      document.getElementById("awayPitch").innerHTML = renderPitch(away.formation, away.startXI);
    }
  }
}

async function refresh(){
  try{
    const fixture = currentFixtureId
      ? (await apiGet(`/fixtures?id=${currentFixtureId}`))[0]
      : await findFixture();
    if(!fixture) return;
    currentFixtureId = fixture.fixture.id;
    render(fixture);
  } catch(err){
    console.error("Overlay error:", err);
  }
}

refresh();
setInterval(refresh, CONFIG.POLL_INTERVAL_MS);
</script>

</body>
</html>
