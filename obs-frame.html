<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Overlay match — AS Monaco</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/dist/tabler-icons.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap');

  :root{
    --bg:#0d1017;
    --panel:#131722;
    --panel-border: rgba(255,255,255,0.07);
    --home:#e30613;      /* rouge AS Monaco */
    --away:#3b6bf5;      /* bleu — équipe adverse */
    --pitch-line: rgba(255,255,255,0.22);
    --text:#f2f2f0;
    --muted:#7d8290;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:1920px; height:1080px; overflow:hidden; font-family:'Inter', sans-serif; background:transparent; color:var(--text); }

  #frame{ position:relative; width:1920px; height:1080px; }

  /* ============ BANDEAU SCORE ============ */
  .top-bar{
    position:absolute; top:0; left:0; width:100%; height:150px;
    background: var(--bg);
    border-bottom: 1px solid var(--panel-border);
    box-shadow: 0 8px 20px rgba(0,0,0,0.35);
    display:grid;
    grid-template-columns: 90px 1fr auto 1fr 90px;
    align-items:center;
    column-gap:20px;
    padding: 0 36px;
  }
  .tb-crest{
    width:78px; height:78px; border-radius:50%; background:var(--panel);
    border: 1px solid var(--panel-border);
    background-size:70%; background-position:center; background-repeat:no-repeat;
    flex-shrink:0;
  }

  .tb-name-block{ display:flex; flex-direction:column; gap:8px; }
  .tb-name-block.home{ align-items:flex-end; }
  .tb-name-block.away{ align-items:flex-start; }
  .tb-name{
    font-family:'Poppins', sans-serif; font-weight:800; font-size:34px; letter-spacing:0.01em;
    text-transform:uppercase; color:var(--text); white-space:nowrap;
  }
  .tb-underline{ height:3px; width:70%; border-radius:2px; }
  .tb-underline.home{ background: var(--home); align-self:flex-end; }
  .tb-underline.away{ background: var(--away); align-self:flex-start; }

  .tb-score-col{ display:flex; flex-direction:column; align-items:center; gap:8px; min-width:200px; }
  .tb-score{ display:flex; align-items:center; gap:20px; }
  .tb-score-val{
    font-family:'Inter', sans-serif; font-weight:900; font-size:56px; line-height:1;
    font-variant-numeric: tabular-nums;
  }
  .tb-score-val.home{ color: var(--home); }
  .tb-score-val.away{ color:#f5f5f2; }
  .tb-score-sep{ font-family:'Inter', sans-serif; font-weight:700; font-size:36px; color: var(--muted); }
  .tb-clock{
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius:8px; padding:5px 16px;
    font-family:'Inter', sans-serif; font-weight:700; font-size:15px; color:var(--text);
    font-variant-numeric: tabular-nums;
  }

  /* ============ PANNEAUX COMPOS ============ */
  .xi-card{
    position:absolute; top:150px; width:400px; height:710px;
    background: var(--panel);
    padding: 18px 20px 20px;
    overflow:hidden;
  }
  .xi-card.left{ left:0; border-right: 2px solid var(--home); }
  .xi-card.right{ right:0; border-left: 2px solid var(--away); }

  .xi-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; }
  .xi-team-name{ font-family:'Poppins', sans-serif; font-weight:800; font-size:19px; text-transform:uppercase; letter-spacing:0.01em; }
  .xi-team-name.home{ color: var(--home); }
  .xi-team-name.away{ color: var(--away); }
  .xi-formation{ font-family:'Inter', sans-serif; font-weight:600; font-size:14px; color: var(--muted); }

  .pitch-wrap{ width:100%; aspect-ratio: 280 / 400; margin-bottom:14px; }

  .subs-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; padding-top:10px; border-top: 1px solid var(--panel-border); }
  .subs-label{ font-family:'Poppins', sans-serif; font-weight:800; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color: var(--muted); }
  .subs-row{ display:flex; justify-content:space-between; gap:6px; }
  .sub-item{ display:flex; flex-direction:column; align-items:center; gap:3px; flex:1; min-width:0; }
  .sub-num{ font-family:'Inter', sans-serif; font-weight:800; font-size:14px; }
  .sub-num.home{ color: var(--home); }
  .sub-num.away{ color: var(--away); }
  .sub-name{ font-family:'Inter', sans-serif; font-weight:600; font-size:10.5px; color: var(--text); text-transform:uppercase; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }

  /* ============ CADRE WEBCAM ============ */
  .webcam-frame{
    position:absolute; top:150px; left:400px; width:1120px; height:710px;
    border: 2px solid var(--home);
    pointer-events:none;
  }

  /* ============ BANDEAU STATS BAS ============ */
  .bottom-panel{
    position:absolute; bottom:0; left:0; width:100%; height:220px;
    background: var(--panel);
    border-top: 1px solid var(--panel-border);
    display:flex;
  }
  .stat-col{
    flex:1; padding: 18px 10px; display:flex; flex-direction:column; align-items:center; gap:10px;
    border-right: 1px solid var(--panel-border);
  }
  .stat-col:last-child{ border-right:none; }
  .stat-head{ display:flex; align-items:center; gap:7px; }
  .stat-head i{ font-size:15px; color: var(--muted); }
  .stat-head span{
    font-family:'Poppins', sans-serif; font-weight:700; font-size:11px; letter-spacing:0.06em;
    text-transform:uppercase; color: var(--muted);
  }
  .stat-nums{ display:flex; align-items:baseline; gap:14px; }
  .stat-num{ font-family:'Inter', sans-serif; font-weight:900; font-size:34px; font-variant-numeric:tabular-nums; }
  .stat-num.home{ color: var(--home); }
  .stat-num.away{ color: var(--away); }
  .stat-bar-track{ width:88%; height:4px; border-radius:2px; overflow:hidden; display:flex; }
  .stat-bar-home{ height:100%; background: var(--home); }
  .stat-bar-away{ height:100%; background: var(--away); }
</style>
</head>
<body>

<div id="frame">

  <div class="top-bar">
    <div class="tb-crest" id="homeCrest"></div>
    <div class="tb-name-block home">
      <div class="tb-name" id="homeName">DOMICILE</div>

      <div class="stat-nums"><div class="stat-num home" id="statShotsHome">0</div><div class="stat-num away" id="statShotsAway">0</div></div>
      <div class="stat-bar-track"><div class="stat-bar-home" id="barShotsHome" style="width:50%"></div><div class="stat-bar-away" id="barShotsAway" style="width:50%"></div></div>

      <div class="stat-bar-track"><div class="stat-bar-home" id="barFoulsHome" style="width:50%"></div><div class="stat-bar-away" id="barFoulsAway" style="width:50%"></div></div>

    <div class="stat-col">
      <div class="stat-head"><i class="ti ti-square-rounded" style="color:#e8b800;"></i><span>Cartons jaunes</span></div>
      <div class="stat-nums"><div class="stat-num home" id="statYellowHome">0</div><div class="stat-num away" id="statYellowAway">0</div></div>
      <div class="stat-bar-track"><div class="stat-bar-home" id="barYellowHome" style="width:50%"></div><div class="stat-bar-away" id="barYellowAway" style="width:50%"></div></div>
    </div>
  </div>

</div>

<script>
/* =====================================================================
   CONFIG
   ===================================================================== */
const CONFIG = {
  API_KEY: "0ff28ece65f54981c6f1967ed9a06cad",
  TEAM_ID: 91,                 // 91 = AS Monaco
  POLL_INTERVAL_MS: 120000,
  DEMO_MODE: true              // true = utilise les fausses données ci-dessous, aucun appel API.
                                // Mets sur false uniquement pour le vrai match.
};

const DEMO_FIXTURE = {
  teams: {
    home: { id: 91, name: "AS Monaco", logo: "" },
    away: { id: 81, name: "Olympique de Marseille", logo: "" }
  },
  goals: { home: 2, away: 1 },
  fixture: { status: { short: "2H", elapsed: 67 } },
  league: { name: "Ligue 1", round: "Regular Season - 5" },
  statistics: [
    { team:{id:91}, statistics:[
      {type:"Ball Possession", value:"60%"}, {type:"Total Shots", value:"14"},
      {type:"Shots on Goal", value:"5"}, {type:"Corner Kicks", value:"8"},
      {type:"Fouls", value:"9"}, {type:"Yellow Cards", value:"1"}
    ]},
    { team:{id:81}, statistics:[
      {type:"Ball Possession", value:"40%"}, {type:"Total Shots", value:"6"},
      {type:"Shots on Goal", value:"2"}, {type:"Corner Kicks", value:"1"},
      {type:"Fouls", value:"7"}, {type:"Yellow Cards", value:"2"}
    ]}
  ],
  lineups: [
    { team: { id: 91 }, formation: "4-2-3-1", startXI: [
      {player:{number:16,name:"Brunner"}},{player:{number:2,name:"Coulibaly"}},{player:{number:3,name:"Golovin"}},{player:{number:21,name:"Idumbo"}},
      {player:{number:4,name:"Camara"}},{player:{number:6,name:"Zakaria"}},
      {player:{number:15,name:"Nazinho"}},{player:{number:10,name:"Dier"}},{player:{number:19,name:"Sané"}},
      {player:{number:11,name:"Vanderson"}}
    ], substitutes: [
      {player:{number:9,name:"Biereth"}},{player:{number:5,name:"Kehrer"}},{player:{number:18,name:"Detourbet"}},
      {player:{number:24,name:"Soubeir"}},{player:{number:27,name:"Touré"}}
    ]},
    { team: { id: 81 }, formation: "4-2-3-1", startXI: [
      {player:{number:1,name:"Rulli"}},{player:{number:2,name:"Murillo"}},{player:{number:5,name:"Balerdi"}},{player:{number:99,name:"Mbemba"}},{player:{number:3,name:"Merlin"}},
      {player:{number:23,name:"Højbjerg"}},{player:{number:27,name:"Veretout"}},
      {player:{number:10,name:"Aubameyang"}},{player:{number:8,name:"Gündogan"}},{player:{number:17,name:"Sarr"}},
      {player:{number:9,name:"Vitinha"}}
    ], substitutes: [
      {player:{number:11,name:"Harit"}},{player:{number:29,name:"Ndiaye"}},{player:{number:19,name:"Kondogbia"}},
      {player:{number:20,name:"Correa"}},{player:{number:62,name:"Mughe"}}
    ]}
  ]
};

const API_BASE = "https://v3.football.api-sports.io";
let currentFixtureId = null;

function apiHeaders(){ return { "x-apisports-key": CONFIG.API_KEY }; }
async function apiGet(path){
  const res = await fetch(API_BASE + path, { headers: apiHeaders() });
  if(!res.ok) throw new Error("API error " + res.status);
  return (await res.json()).response;
}
function isoDate(d){ return d.toISOString().slice(0,10); }

function currentSeason(){
  // La saison européenne démarre autour de juillet : avant juillet on est
  // encore sur la saison qui a commencé l'année précédente.
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth() + 1; // 1-12
  return month >= 7 ? year : year - 1;
}

async function findFixture(){
  const live = await apiGet(`/fixtures?team=${CONFIG.TEAM_ID}&live=all`);
  if(live && live.length > 0) return live[0];

  const today = new Date();
  const from = new Date(today); from.setDate(from.getDate() - 10);
  const to   = new Date(today); to.setDate(to.getDate() + 21);
  const window = await apiGet(`/fixtures?team=${CONFIG.TEAM_ID}&season=${currentSeason()}&from=${isoDate(from)}&to=${isoDate(to)}&timezone=Europe/Paris`);
  if(!window || window.length === 0) return null;

  const sorted = [...window].sort((a,b) => new Date(a.fixture.date) - new Date(b.fixture.date));
  const finishedStatuses = new Set(["FT","AET","PEN","PST","CANC","ABD","AWD","WO"]);
  const upcoming = sorted.find(f => !finishedStatuses.has(f.fixture.status.short));
  return upcoming || sorted[sorted.length - 1];
}

/* ---------- Positionnement tactique (terrain) ---------- */
function buildPositions(formation, startXI){
  const hasGrid = startXI.every(p => p.player.grid);
  if(hasGrid){
    const rows = {};
    startXI.forEach(p => {
      const [r,c] = p.player.grid.split(":").map(Number);
      if(!rows[r]) rows[r] = [];
      rows[r].push({ player: p.player, col: c });
    });
    const rowNums = Object.keys(rows).map(Number).sort((a,b)=>a-b);
    const maxRow = Math.max(...rowNums);
    const positions = [];
    rowNums.forEach(r => {
      const arr = rows[r].sort((a,b)=>a.col-b.col);
      const n = arr.length;
      arr.forEach((p,i) => positions.push({ player: p.player, x:(i+1)/(n+1), y: (r-1)/((maxRow-1)||1) }));
    });
    return positions;
  }
  const lines = (formation || "").split("-").map(n => parseInt(n,10)).filter(n => !isNaN(n));
  const groups = [1, ...lines];
  const positions = [];
  let idx = 0;
  groups.forEach((count, li) => {
    const rowPlayers = startXI.slice(idx, idx+count);
    idx += count;
    rowPlayers.forEach((p,ci) => positions.push({ player: p.player, x:(ci+1)/(count+1), y: li/((groups.length-1)||1) }));
  });
  return positions;
}

function renderPitch(formation, startXI, side){
  const positions = buildPositions(formation, startXI);
  const W = 280, H = 400;
  const boundary = { x:4, y:4, w:272, h:392 };
  const marginX = 22, marginTop = 24, marginBottom = 38;
  const usableW = W - marginX*2, usableH = H - marginTop - marginBottom;
  const halfwayY = boundary.y + boundary.h/2;
  const numColor = side === "home" ? "#ff5a68" : "#7a9bff";

  const markers = positions.map((p) => {
    const cx = marginX + p.x * usableW, cy = marginTop + p.y * usableH;
    const rowSize = positions.filter(q => Math.abs(q.y - p.y) < 0.001).length;
    const fontSize = rowSize >= 5 ? 9 : rowSize === 4 ? 9.5 : 11;
    const surname = (p.player.name || "").split(" ").slice(-1)[0].toUpperCase();
    const slotWidth = usableW / (rowSize + 1) - 4;
    const naturalWidth = surname.length * fontSize * 0.62;
    const clampedWidth = Math.min(naturalWidth, slotWidth);
    return `
      <text x="${cx}" y="${cy-3}" text-anchor="middle" font-family="Inter" font-weight="800" font-size="14" fill="${numColor}">${p.player.number ?? ""}</text>
      <text x="${cx}" y="${cy+15}" text-anchor="middle" font-family="Inter" font-weight="700" font-size="${fontSize}" fill="#f2f2f0"
            textLength="${clampedWidth}" lengthAdjust="spacingAndGlyphs">${surname}</text>`;
  }).join("");

  return `
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" style="display:block;">
      <rect x="${boundary.x}" y="${boundary.y}" width="${boundary.w}" height="${boundary.h}" fill="none" stroke="var(--pitch-line)" stroke-width="1.4"/>
      <line x1="${boundary.x}" y1="${halfwayY}" x2="${boundary.x+boundary.w}" y2="${halfwayY}" stroke="var(--pitch-line)" stroke-width="1.2"/>
      <circle cx="${W/2}" cy="${halfwayY}" r="32" fill="none" stroke="var(--pitch-line)" stroke-width="1.2"/>
      <circle cx="${W/2}" cy="${halfwayY}" r="2" fill="var(--pitch-line)"/>
      <rect x="${W/2-56}" y="${boundary.y+boundary.h-40}" width="112" height="40" fill="none" stroke="var(--pitch-line)" stroke-width="1.1"/>
      <rect x="${W/2-27}" y="${boundary.y+boundary.h-15}" width="54" height="15" fill="none" stroke="var(--pitch-line)" stroke-width="1.1"/>
      <rect x="${W/2-56}" y="${boundary.y}" width="112" height="40" fill="none" stroke="var(--pitch-line)" stroke-width="1.1"/>
      <rect x="${W/2-27}" y="${boundary.y+15}" width="54" height="15" fill="none" stroke="var(--pitch-line)" stroke-width="1.1"/>
      ${markers}
    </svg>`;
}

function renderSubs(el, substitutes, side){
  if(!substitutes || substitutes.length === 0){ el.innerHTML = ""; return; }
  el.innerHTML = substitutes.slice(0, 5).map(p => `
    <div class="sub-item">
      <div class="sub-num ${side}">${p.player.number ?? ""}</div>
      <div class="sub-name">${(p.player.name || "").split(" ").slice(-1)[0]}</div>
    </div>`).join("");
}

function setCrest(el, logo){ el.style.backgroundImage = logo ? `url(${logo})` : ""; }

function findStat(statistics, teamId, type){
  const entry = statistics?.find(s => s.team.id === teamId)?.statistics?.find(s => s.type === type);
  const raw = entry?.value;
  if(raw === null || raw === undefined) return 0;
  return parseFloat(String(raw).replace("%","")) || 0;
}

function applyStatPair(prefix, homeVal, awayVal, suffix){
  const max = Math.max(homeVal, awayVal, 1);
  document.getElementById(`stat${prefix}Home`).textContent = homeVal + (suffix||"");
  document.getElementById(`stat${prefix}Away`).textContent = awayVal + (suffix||"");
  document.getElementById(`bar${prefix}Home`).style.width = (homeVal/max*50) + "%";
  document.getElementById(`bar${prefix}Away`).style.width = (awayVal/max*50) + "%";
}

function render(fixture){
  const { teams, goals, fixture: fx, statistics } = fixture;

  setCrest(document.getElementById("homeCrest"), teams.home.logo);
  setCrest(document.getElementById("awayCrest"), teams.away.logo);

  document.getElementById("homeName").textContent = teams.home.name;
  document.getElementById("awayName").textContent = teams.away.name;
  document.getElementById("xiHomeName").textContent = teams.home.name;
  document.getElementById("xiAwayName").textContent = teams.away.name;
  document.getElementById("homeScore").textContent = goals.home ?? 0;
  document.getElementById("awayScore").textContent = goals.away ?? 0;
  document.getElementById("clock").textContent = fx.status.elapsed ? `${fx.status.elapsed}'` : (fx.status.short === "NS" ? "À venir" : fx.status.short);

  applyStatPair("Poss", findStat(statistics, teams.home.id, "Ball Possession"), findStat(statistics, teams.away.id, "Ball Possession"), "%");
  applyStatPair("Shots", findStat(statistics, teams.home.id, "Total Shots"), findStat(statistics, teams.away.id, "Total Shots"));
  applyStatPair("OnTarget", findStat(statistics, teams.home.id, "Shots on Goal"), findStat(statistics, teams.away.id, "Shots on Goal"));
  applyStatPair("Corners", findStat(statistics, teams.home.id, "Corner Kicks"), findStat(statistics, teams.away.id, "Corner Kicks"));
  applyStatPair("Fouls", findStat(statistics, teams.home.id, "Fouls"), findStat(statistics, teams.away.id, "Fouls"));
  applyStatPair("Yellow", findStat(statistics, teams.home.id, "Yellow Cards"), findStat(statistics, teams.away.id, "Yellow Cards"));

  if(fixture.lineups && fixture.lineups.length >= 2){
    const home = fixture.lineups.find(l => l.team.id === teams.home.id);
    const away = fixture.lineups.find(l => l.team.id === teams.away.id);
    if(home?.startXI?.length){
      document.getElementById("homeFormation").textContent = home.formation || "";
      document.getElementById("homePitch").innerHTML = renderPitch(home.formation, home.startXI, "home");
      renderSubs(document.getElementById("homeSubs"), home.substitutes, "home");
    }
    if(away?.startXI?.length){
      document.getElementById("awayFormation").textContent = away.formation || "";
      document.getElementById("awayPitch").innerHTML = renderPitch(away.formation, away.startXI, "away");
      renderSubs(document.getElementById("awaySubs"), away.substitutes, "away");
    }
  }
}

async function refresh(){
  if(CONFIG.DEMO_MODE){
    render(DEMO_FIXTURE);
    return;
  }
  try{
    const fixture = currentFixtureId
      ? (await apiGet(`/fixtures?id=${currentFixtureId}`))[0]
      : await findFixture();
    if(!fixture) return;
    currentFixtureId = fixture.fixture.id;
    render(fixture);
  } catch(err){
    console.error("Overlay error:", err);
  }
}

refresh();
setInterval(refresh, CONFIG.POLL_INTERVAL_MS);
</script>

</body>
</html>
