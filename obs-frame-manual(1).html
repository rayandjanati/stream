<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Overlay match — AS Monaco</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap');

  :root{
    --bg:#0d1017;
    --panel:#131722;
    --panel-border: rgba(255,255,255,0.07);
    --home:#e30613;      /* rouge AS Monaco */
    --away:#3b6bf5;      /* bleu — équipe adverse */
    --pitch-line: rgba(255,255,255,0.22);
    --text:#f2f2f0;
    --muted:#7d8290;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:1920px; height:1080px; overflow:hidden; font-family:'Inter', sans-serif; background:transparent; color:var(--text); }

  #frame{ position:relative; width:1920px; height:1080px; }

  /* ============ BANDEAU SCORE ============ */
  .top-bar{
    position:absolute; top:0; left:0; width:100%; height:150px;
    background: var(--bg);
    border-bottom: 1px solid var(--panel-border);
    box-shadow: 0 8px 20px rgba(0,0,0,0.35);
    display:grid;
    grid-template-columns: 90px 1fr auto 1fr 90px;
    align-items:center;
    column-gap:20px;
    padding: 0 36px;
  }
  .tb-crest{
    width:78px; height:78px; border-radius:50%; background:var(--panel);
    border: 1px solid var(--panel-border);
    background-size:70%; background-position:center; background-repeat:no-repeat;
    flex-shrink:0;
  }

  .tb-name-block{ display:flex; flex-direction:column; gap:8px; }
  .tb-name-block.home{ align-items:flex-end; }
  .tb-name-block.away{ align-items:flex-start; }
  .tb-name{
    font-family:'Poppins', sans-serif; font-weight:800; font-size:34px; letter-spacing:0.01em;
    text-transform:uppercase; color:var(--text); white-space:nowrap;
  }
  .tb-underline{ height:3px; width:70%; border-radius:2px; }
  .tb-underline.home{ background: var(--home); align-self:flex-end; }
  .tb-underline.away{ background: var(--away); align-self:flex-start; }

  .tb-score-col{ display:flex; flex-direction:column; align-items:center; gap:8px; min-width:200px; }
  .tb-score{ display:flex; align-items:center; gap:20px; }
  .tb-score-val{
    font-family:'Inter', sans-serif; font-weight:900; font-size:56px; line-height:1;
    font-variant-numeric: tabular-nums;
  }
  .tb-score-val.home{ color: var(--home); }
  .tb-score-val.away{ color:#f5f5f2; }
  .tb-score-val[contenteditable]{ outline:none; cursor:text; border-radius:6px; padding:0 4px; }
  .tb-score-val[contenteditable]:hover{ background: rgba(255,255,255,0.06); }
  .tb-clock[contenteditable]{ outline:none; cursor:text; }

  /* Visible UNIQUEMENT quand la fenêtre a le focus (donc seulement quand toi,
     le streamer, es en train d'interagir avec la source dans OBS — jamais
     visible dans le flux vu par les spectateurs). */
  .chrono-status{
    display:none;
    margin-top:4px;
    font-family:'Inter', sans-serif; font-size:11px; font-weight:600;
    color: var(--muted); text-align:center; letter-spacing:0.02em;
  }
  .chrono-status.visible{ display:block; }
  .tb-score-sep{ font-family:'Inter', sans-serif; font-weight:700; font-size:36px; color: var(--muted); }
  .tb-clock{
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius:8px; padding:5px 16px;
    font-family:'Inter', sans-serif; font-weight:700; font-size:15px; color:var(--text);
    font-variant-numeric: tabular-nums;
  }

  /* ============ PANNEAUX COMPOS ============ */
  .xi-card{
    position:absolute; top:150px; width:400px; height:710px;
    background: var(--panel);
    padding: 18px 20px 20px;
    overflow:hidden;
  }
  .xi-card.left{ left:0; border-right: 2px solid var(--home); }
  .xi-card.right{ right:0; border-left: 2px solid var(--away); }

  .xi-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; }
  .xi-team-name{ font-family:'Poppins', sans-serif; font-weight:800; font-size:19px; text-transform:uppercase; letter-spacing:0.01em; }
  .xi-team-name.home{ color: var(--home); }
  .xi-team-name.away{ color: var(--away); }
  .xi-formation{ font-family:'Inter', sans-serif; font-weight:600; font-size:14px; color: var(--muted); }

  .pitch-wrap{ width:100%; aspect-ratio: 280 / 400; margin-bottom:14px; }

  .subs-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; padding-top:10px; border-top: 1px solid var(--panel-border); }
  .subs-label{ font-family:'Poppins', sans-serif; font-weight:800; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color: var(--muted); }
  .subs-row{ display:flex; justify-content:space-between; gap:6px; }
  .sub-item{ display:flex; flex-direction:column; align-items:center; gap:3px; flex:1; min-width:0; }
  .sub-num{ font-family:'Inter', sans-serif; font-weight:800; font-size:14px; }
  .sub-num.home{ color: var(--home); }
  .sub-num.away{ color: var(--away); }
  .sub-name{ font-family:'Inter', sans-serif; font-weight:600; font-size:10.5px; color: var(--text); text-transform:uppercase; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }

  /* ============ CADRE WEBCAM ============ */
  .webcam-frame{
    position:absolute; top:150px; left:400px; width:1120px; height:710px;
    border: 2px solid var(--home);
    pointer-events:none;
  }
  /* ============ BANDEAU BAS — fond uni, sans contenu ============ */
  .bottom-panel{
    position:absolute; bottom:0; left:0; width:100%; height:220px;
    background: var(--panel);
    border-top: 1px solid var(--panel-border);
  }
</style>
</head>
<body>

<div id="frame">

  <div class="top-bar">
    <div class="tb-crest" id="homeCrest"></div>
    <div class="tb-name-block home">
      <div class="tb-name" id="homeName">DOMICILE</div>
      <div class="tb-underline home"></div>
    </div>
    <div class="tb-score-col">
      <div class="tb-score">
        <div class="tb-score-val home" id="homeScore" contenteditable="true" spellcheck="false">0</div>
        <div class="tb-score-sep">–</div>
        <div class="tb-score-val away" id="awayScore" contenteditable="true" spellcheck="false">0</div>
      </div>
      <div class="tb-clock" id="clock" contenteditable="true" spellcheck="false">0'</div>
      <div class="chrono-status" id="chronoStatus">❚❚ Chrono en pause</div>
    </div>
    <div class="tb-name-block away">
      <div class="tb-name" id="awayName">EXTÉRIEUR</div>
      <div class="tb-underline away"></div>
    </div>
    <div class="tb-crest" id="awayCrest"></div>
  </div>

  <div class="xi-card left">
    <div class="xi-head">
      <div class="xi-team-name home" id="xiHomeName">DOMICILE</div>
      <div class="xi-formation" id="homeFormation"></div>
    </div>
    <div class="pitch-wrap" id="homePitch"></div>
    <div class="subs-head"><div class="subs-label">Remplaçants</div></div>
    <div class="subs-row" id="homeSubs"></div>
  </div>

  <div class="webcam-frame"></div>

  <div class="xi-card right">
    <div class="xi-head">
      <div class="xi-team-name away" id="xiAwayName">EXTÉRIEUR</div>
      <div class="xi-formation" id="awayFormation"></div>
    </div>
    <div class="pitch-wrap" id="awayPitch"></div>
    <div class="subs-head"><div class="subs-label">Remplaçants</div></div>
    <div class="subs-row" id="awaySubs"></div>
  </div>

  <div class="bottom-panel"></div>

</div>

<script>
/* =====================================================================
   CONFIG
   ===================================================================== */
/* =====================================================================
   VERSION MANUELLE — aucun appel API, aucune connexion internet requise
   pour les données. Remplis les infos ci-dessous avant chaque match en
   éditant directement ce fichier, puis recharge la source dans OBS.

   Le SCORE et la MINUTE sont modifiables en direct dans OBS : active
   "Interagir" (clic droit sur la source > Interagir), clique sur le
   chiffre à modifier, tape la nouvelle valeur.
   ===================================================================== */

const MATCH_DATA = {
  teams: {
    home: { name: "AS Monaco", logo: "" },
    away: { name: "Olympique de Marseille", logo: "" }
  },
  competition: "Ligue 1 · J5",
  lineups: [
    { side: "home", formation: "4-2-3-1", startXI: [
      {number:16,name:"Brunner"}, {number:2,name:"Coulibaly"}, {number:3,name:"Golovin"}, {number:21,name:"Idumbo"},
      {number:4,name:"Camara"}, {number:6,name:"Zakaria"},
      {number:15,name:"Nazinho"}, {number:10,name:"Dier"}, {number:19,name:"Sané"},
      {number:11,name:"Vanderson"}
    ], substitutes: [
      {number:9,name:"Biereth"}, {number:5,name:"Kehrer"}, {number:18,name:"Detourbet"},
      {number:24,name:"Soubeir"}, {number:27,name:"Touré"}
    ]},
    { side: "away", formation: "4-2-3-1", startXI: [
      {number:1,name:"Rulli"}, {number:2,name:"Murillo"}, {number:5,name:"Balerdi"}, {number:99,name:"Mbemba"}, {number:3,name:"Merlin"},
      {number:23,name:"Højbjerg"}, {number:27,name:"Veretout"},
      {number:10,name:"Aubameyang"}, {number:8,name:"Gündogan"}, {number:17,name:"Sarr"},
      {number:9,name:"Vitinha"}
    ], substitutes: [
      {number:11,name:"Harit"}, {number:29,name:"Ndiaye"}, {number:19,name:"Kondogbia"},
      {number:20,name:"Correa"}, {number:62,name:"Mughe"}
    ]}
  ]
};

/* ---------- Positionnement tactique (terrain) ---------- */
function buildPositions(formation, startXI){
  const lines = (formation || "").split("-").map(n => parseInt(n,10)).filter(n => !isNaN(n));
  const groups = [1, ...lines];
  const positions = [];
  let idx = 0;
  groups.forEach((count, li) => {
    const rowPlayers = startXI.slice(idx, idx+count);
    idx += count;
    rowPlayers.forEach((p,ci) => positions.push({ ...p, x:(ci+1)/(count+1), y: li/((groups.length-1)||1) }));
  });
  return positions;
}

function renderPitch(formation, startXI, side){
  const positions = buildPositions(formation, startXI);
  const W = 280, H = 400;
  const boundary = { x:4, y:4, w:272, h:392 };
  const marginX = 22, marginTop = 24, marginBottom = 38;
  const usableW = W - marginX*2, usableH = H - marginTop - marginBottom;
  const halfwayY = boundary.y + boundary.h/2;
  const numColor = side === "home" ? "#ff5a68" : "#7a9bff";

  const markers = positions.map((p) => {
    const cx = marginX + p.x * usableW, cy = marginTop + p.y * usableH;
    const rowSize = positions.filter(q => Math.abs(q.y - p.y) < 0.001).length;
    const fontSize = rowSize >= 5 ? 9 : rowSize === 4 ? 9.5 : 11;
    const surname = (p.name || "").split(" ").slice(-1)[0].toUpperCase();
    const slotWidth = usableW / (rowSize + 1) - 4;
    const naturalWidth = surname.length * fontSize * 0.62;
    const clampedWidth = Math.min(naturalWidth, slotWidth);
    return `
      <text x="${cx}" y="${cy-3}" text-anchor="middle" font-family="Inter" font-weight="800" font-size="14" fill="${numColor}">${p.number ?? ""}</text>
      <text x="${cx}" y="${cy+15}" text-anchor="middle" font-family="Inter" font-weight="700" font-size="${fontSize}" fill="#f2f2f0"
            textLength="${clampedWidth}" lengthAdjust="spacingAndGlyphs">${surname}</text>`;
  }).join("");

  return `
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" style="display:block;">
      <rect x="${boundary.x}" y="${boundary.y}" width="${boundary.w}" height="${boundary.h}" fill="none" stroke="var(--pitch-line)" stroke-width="1.4"/>
      <line x1="${boundary.x}" y1="${halfwayY}" x2="${boundary.x+boundary.w}" y2="${halfwayY}" stroke="var(--pitch-line)" stroke-width="1.2"/>
      <circle cx="${W/2}" cy="${halfwayY}" r="32" fill="none" stroke="var(--pitch-line)" stroke-width="1.2"/>
      <circle cx="${W/2}" cy="${halfwayY}" r="2" fill="var(--pitch-line)"/>
      <rect x="${W/2-56}" y="${boundary.y+boundary.h-40}" width="112" height="40" fill="none" stroke="var(--pitch-line)" stroke-width="1.1"/>
      <rect x="${W/2-27}" y="${boundary.y+boundary.h-15}" width="54" height="15" fill="none" stroke="var(--pitch-line)" stroke-width="1.1"/>
      <rect x="${W/2-56}" y="${boundary.y}" width="112" height="40" fill="none" stroke="var(--pitch-line)" stroke-width="1.1"/>
      <rect x="${W/2-27}" y="${boundary.y+15}" width="54" height="15" fill="none" stroke="var(--pitch-line)" stroke-width="1.1"/>
      ${markers}
    </svg>`;
}

function renderSubs(el, substitutes, side){
  if(!substitutes || substitutes.length === 0){ el.innerHTML = ""; return; }
  el.innerHTML = substitutes.slice(0, 5).map(p => `
    <div class="sub-item">
      <div class="sub-num ${side}">${p.number ?? ""}</div>
      <div class="sub-name">${(p.name || "").split(" ").slice(-1)[0]}</div>
    </div>`).join("");
}

function setCrest(el, logo){ el.style.backgroundImage = logo ? `url(${logo})` : ""; }

function render(){
  const { teams, lineups } = MATCH_DATA;

  setCrest(document.getElementById("homeCrest"), teams.home.logo);
  setCrest(document.getElementById("awayCrest"), teams.away.logo);

  document.getElementById("homeName").textContent = teams.home.name;
  document.getElementById("awayName").textContent = teams.away.name;
  document.getElementById("xiHomeName").textContent = teams.home.name;
  document.getElementById("xiAwayName").textContent = teams.away.name;

  const home = lineups.find(l => l.side === "home");
  const away = lineups.find(l => l.side === "away");
  if(home?.startXI?.length){
    document.getElementById("homeFormation").textContent = home.formation || "";
    document.getElementById("homePitch").innerHTML = renderPitch(home.formation, home.startXI, "home");
    renderSubs(document.getElementById("homeSubs"), home.substitutes, "home");
  }
  if(away?.startXI?.length){
    document.getElementById("awayFormation").textContent = away.formation || "";
    document.getElementById("awayPitch").innerHTML = renderPitch(away.formation, away.startXI, "away");
    renderSubs(document.getElementById("awaySubs"), away.substitutes, "away");
  }
}

render();

/* ---------- Chrono automatique (raccourci clavier, invisible à l'écran) ---------- */
let chronoRunning = false;
let chronoStartTs = 0;

function tickChrono(){
  const el = document.getElementById("clock");
  const minutes = Math.floor((Date.now() - chronoStartTs) / 60000);
  el.textContent = `${minutes}'`;
}

function toggleChrono(){
  const el = document.getElementById("clock");
  if(!chronoRunning){
    // Repart depuis la valeur actuellement affichée (permet de corriger la minute avant de lancer)
    const currentMin = parseInt(el.textContent, 10) || 0;
    chronoStartTs = Date.now() - currentMin * 60000;
    chronoRunning = true;
    window.__chronoInterval = setInterval(tickChrono, 1000);
  } else {
    chronoRunning = false;
    clearInterval(window.__chronoInterval);
  }
  updateChronoStatusText();
}

function updateChronoStatusText(){
  const el = document.getElementById("chronoStatus");
  if(chronoRunning){
    el.textContent = "● Chrono en cours";
    el.style.color = "#3ecb7e";
  } else {
    el.textContent = "❚❚ Chrono en pause";
    el.style.color = "var(--muted)";
  }
}

// Le voyant reste affiché dans la source pour que tu voies immédiatement l'état du chrono.

// Barre d'espace = démarrer/mettre en pause. Ne s'active pas si tu es en train
// de taper dans un champ (score, minute) pour ne pas gêner la saisie.
document.addEventListener("keydown", (e) => {
  const editing = document.activeElement && document.activeElement.getAttribute("contenteditable") === "true";
  if(e.code === "Space" && !editing){
    e.preventDefault();
    toggleChrono();
  }
});

// Si on clique dans la minute pour la corriger à la main, on met le chrono en pause
// automatiquement pour que la correction ne soit pas écrasée à la seconde suivante.
document.getElementById("clock").addEventListener("focus", () => {
  if(chronoRunning) toggleChrono();
});
</script>

</body>
</html>
